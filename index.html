<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14062b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pharaoh">
<meta name="description" content="Lord Pharaoh: Verses of the Neon Oasis, a poem-magic adventure.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<title>Lord Pharaoh: Verses of the Neon Oasis</title>
<style>
:root{--gold:#f5c96a;--gold2:#ffe3a0;--violet:#7b3fe4;--night:#0d0420;--neon:#ff4fd8;--cyan:#4ff3ff;--panel:rgba(28,11,56,.82);--line:rgba(245,201,106,.38);--serif:Georgia,"Times New Roman","Noto Serif","DejaVu Serif",serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--night);color:#f4eaff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
#bg,#fx{position:fixed;inset:0;width:100%;height:100%}
#bg{z-index:0}#fx{z-index:8;pointer-events:none}
#floaters{position:fixed;inset:0;z-index:9;pointer-events:none}
.screen{position:fixed;inset:0;z-index:2;display:none;flex-direction:column;align-items:center;overflow-y:auto;overflow-x:hidden;padding:calc(env(safe-area-inset-top) + 58px) 12px calc(env(safe-area-inset-bottom) + 18px)}
.screen.active{display:flex;animation:fadeIn .35s ease}
.wrap{width:100%;max-width:980px}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#topbar{position:fixed;top:0;left:0;right:0;z-index:6;display:none;gap:6px;align-items:center;padding:calc(env(safe-area-inset-top) + 8px) 10px 10px;background:linear-gradient(#0d0420f2,#0d042000)}
#topbar.show{display:flex}
#topbar .grow{flex:1;text-align:center;font-family:var(--serif);color:var(--gold);font-size:15px;letter-spacing:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:13px;white-space:nowrap}
button.chip:active{transform:scale(.96)}
.btn{background:linear-gradient(180deg,#f9d77e,#c9942f);color:#2a1300;border:none;border-radius:12px;padding:12px 20px;font-weight:700;font-size:16px;letter-spacing:.5px;box-shadow:0 0 18px rgba(245,201,106,.35),inset 0 -2px 0 rgba(0,0,0,.2);min-height:46px}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--gold2);border:1px solid var(--line);box-shadow:none}
.btn.neon{background:linear-gradient(180deg,#ff79e4,#a12ee0);color:#fff;box-shadow:0 0 18px rgba(255,79,216,.5)}
.btn.calm{background:linear-gradient(180deg,#9ff6ff,#3aa6d9);color:#04202c;box-shadow:0 0 18px rgba(79,243,255,.4)}
.btn:disabled{opacity:.4;filter:grayscale(.6);cursor:not-allowed}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 10px 40px rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
h1,h2,h3{font-family:var(--serif);color:var(--gold);margin:.2em 0;font-weight:normal}
.muted{opacity:.75}.small{font-size:13px}.center{text-align:center}
.bar{height:9px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:6px;transition:width .35s ease}
.bar.hp>i{background:linear-gradient(90deg,#ff5f6d,#ffc371)}
.bar.mp>i{background:linear-gradient(90deg,#4ff3ff,#7b6bff)}
.bar.xp>i{background:linear-gradient(90deg,#f5c96a,#fff1b8)}
.bar.bond>i{background:linear-gradient(90deg,#ff9ad5,#ffd36b)}
.bar.harm>i{background:linear-gradient(90deg,#ff3b5c,#ff8a5c)}
.bar.disc>i{background:linear-gradient(90deg,#b44dff,#ff4fd8)}
.lbl{display:flex;justify-content:space-between;font-size:11px;opacity:.85;margin:3px 0 2px}
#title{justify-content:center;text-align:center;padding-top:20px}
.logo{font-family:var(--serif);font-size:clamp(40px,11vw,86px);line-height:.95;color:var(--gold);text-shadow:0 0 22px rgba(245,201,106,.6),0 0 60px rgba(255,79,216,.35);letter-spacing:3px}
.sub{font-family:var(--serif);font-style:italic;font-size:clamp(18px,4.6vw,28px);color:#ffd9f6;text-shadow:0 0 12px var(--neon);margin:8px 0 6px}
.byline{font-size:13px;letter-spacing:3px;color:var(--cyan);text-shadow:0 0 8px var(--cyan);margin-bottom:28px}
.stack{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%;max-width:320px;margin:0 auto}
.stack .btn{width:100%}
.story{max-width:620px;font-family:var(--serif);font-size:18px;line-height:1.6;margin-top:auto;margin-bottom:16px}
.story p{margin:0 0 14px}
.story .who{color:var(--gold);font-style:italic}
#intro .stack{margin-bottom:auto}
.stats{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.portrait{width:64px;height:64px;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle at 50% 35%,#3b1a6e,#12052a);overflow:hidden;flex:none;box-shadow:0 0 14px rgba(245,201,106,.4)}
.portrait svg{width:100%;height:100%;display:block}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:12px;text-align:center}
.statgrid b{display:block;font-size:16px;color:var(--gold2)}
.chapter{margin:12px 0;text-align:center;font-family:var(--serif)}
.chapter .t{font-size:20px;color:#ffd9f6;text-shadow:0 0 10px var(--neon)}
.locs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:760px){.locs{grid-template-columns:repeat(3,1fr)}}
.loc{position:relative;text-align:left;background:linear-gradient(160deg,rgba(60,24,110,.85),rgba(20,7,44,.9));border:1px solid var(--line);border-radius:16px;padding:12px;min-height:112px;display:flex;flex-direction:column;gap:4px;transition:transform .15s,box-shadow .15s}
.loc:hover,.loc:focus-visible{box-shadow:0 0 22px rgba(255,79,216,.35);transform:translateY(-2px);outline:none}
.loc:active{transform:scale(.97)}
.loc svg{width:38px;height:38px}
.loc .n{font-family:var(--serif);color:var(--gold);font-size:17px}
.loc .d{font-size:12px;opacity:.8}
.loc .badge{position:absolute;top:10px;right:10px;font-size:11px;padding:2px 8px;border-radius:999px;background:#ff4fd8;color:#fff;box-shadow:0 0 10px #ff4fd8}
.loc.main{border-color:var(--gold);box-shadow:0 0 18px rgba(245,201,106,.25)}
.tip{margin-top:12px;font-family:var(--serif);font-style:italic;font-size:15px;display:flex;gap:10px;align-items:center}
.tip .portrait{width:48px;height:48px}
#battle{padding-left:8px;padding-right:8px}
.bhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:6px;gap:8px}
.foes{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;min-height:170px}
.foe{width:118px;padding:6px 7px 8px;border-radius:14px;background:rgba(18,6,38,.6);border:1px solid rgba(255,255,255,.12);text-align:center;position:relative;transition:transform .2s,opacity .5s,border-color .2s;cursor:pointer}
.foe.boss{width:min(240px,70vw)}
.foe.sel{border-color:var(--gold);box-shadow:0 0 16px rgba(245,201,106,.45)}
.foe.gone{opacity:.25;filter:grayscale(1)}
.foe.purified{opacity:.6;border-color:var(--cyan)}
.foe svg{width:72px;height:72px;animation:bob 2.4s ease-in-out infinite}
.foe.boss svg{width:130px;height:110px}
.foe .nm{font-size:11px;font-family:var(--serif);color:#ffd9f6;min-height:28px;line-height:1.2}
.foe .tags{font-size:10px;min-height:14px;color:#ffb37a}
@keyframes bob{50%{transform:translateY(-6px)}}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.party{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.pc{display:flex;gap:8px;align-items:center;padding:8px;border-radius:14px;background:rgba(18,6,38,.65);border:1px solid var(--line);position:relative}
.pc .portrait{width:46px;height:46px}
.pc .info{flex:1;min-width:0}
.pc .nm{font-family:var(--serif);color:var(--gold);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shieldpip{position:absolute;top:4px;right:8px;font-size:11px;color:#c9d3e0}
.verse{display:flex;gap:6px;justify-content:center;align-items:center;min-height:52px;padding:6px;border-radius:14px;border:1px dashed var(--line);background:rgba(0,0,0,.25)}
.slot{flex:1;max-width:120px;height:40px;border-radius:10px;border:1px dashed rgba(245,201,106,.3);display:flex;align-items:center;justify-content:center;font-family:var(--serif);letter-spacing:2px;font-size:15px}
.slot.f{border-style:solid;background:rgba(245,201,106,.12);cursor:pointer}
.preview{text-align:center;min-height:40px;font-size:13px;margin:6px 0;line-height:1.35}
.preview .sp{font-family:var(--serif);color:var(--gold2);font-size:16px;text-shadow:0 0 10px rgba(245,201,106,.6)}
.hand{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media(min-width:760px){.hand{grid-template-columns:repeat(7,1fr)}}
.tile{min-height:52px;border-radius:12px;border:1px solid rgba(245,201,106,.5);background:linear-gradient(180deg,rgba(80,36,140,.95),rgba(36,12,72,.95));font-family:var(--serif);letter-spacing:2px;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;transition:transform .12s;color:#fff3d0}
.tile small{font-family:system-ui,sans-serif;letter-spacing:0;font-size:10px;opacity:.7}
.tile.used{opacity:.25}
.tile:active{transform:scale(.94)}
.actions{display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px;margin-top:8px}
.actions .btn{padding:10px 6px;font-size:14px}
.actions2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}
.actions2 .btn{padding:8px 4px;font-size:12px;min-height:38px}
.log{font-size:12px;opacity:.85;margin-top:8px;min-height:48px;line-height:1.45}
.log div:first-child{color:var(--gold2)}
.incant{position:fixed;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;pointer-events:none;flex-direction:column}
.incant .line{font-family:var(--serif);font-size:clamp(22px,6vw,44px);letter-spacing:6px;color:#fff;text-shadow:0 0 18px var(--gold),0 0 40px var(--neon);animation:incant 1.1s ease forwards}
.incant .nm{font-family:var(--serif);font-style:italic;font-size:clamp(18px,4.5vw,30px);color:var(--gold2);text-shadow:0 0 14px var(--gold);animation:incant 1.1s .08s ease forwards;opacity:0}
@keyframes incant{0%{opacity:0;transform:scale(.8)}20%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(1.08)}}
.float{position:fixed;font-weight:800;font-size:18px;text-shadow:0 2px 6px #000;animation:floatUp 1.1s ease-out forwards;white-space:nowrap;transform:translateX(-50%)}
@keyframes floatUp{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-56px}}
.f-dmg{color:#ff7a5c}.f-calm{color:#9ff6ff}.f-heal{color:#8dffb5}.f-shield{color:#d6dde8}
#modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(5,0,15,.7);padding:16px}
#modal.show{display:flex;animation:fadeIn .25s}
#modal .panel{max-width:460px;width:100%;max-height:88vh;overflow:auto;text-align:center}
#modal .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.rew{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);z-index:21;background:var(--panel);border:1px solid var(--gold);padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:92vw;text-align:center}
#toast.show{opacity:1}
.tracks{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:760px){.tracks{grid-template-columns:1fr 1fr}}
.track h3{font-size:19px}
.track ul{margin:6px 0 10px;padding-left:18px;font-size:13px;line-height:1.5}
#stage{display:none;flex-direction:column;align-items:center;gap:8px}
#stage.on{display:flex}
#tcan{width:min(340px,86vw);height:min(340px,86vw);border-radius:50%;touch-action:none}
.exname{font-family:var(--serif);font-size:24px;color:var(--gold)}
.tapzone{width:min(340px,86vw);min-height:64px;font-size:18px;touch-action:none}
#library{background:#f3ead7;color:#3b2a1a}
#library h1,#library h2,#library h3{color:#5a3a1e}
#library .wrap{font-family:Georgia,"Times New Roman",serif}
.scrolls{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:700px){.scrolls{grid-template-columns:1fr 1fr}}
.scroll{background:#fbf5e6;border:1px solid #c9ae86;border-radius:10px;padding:12px 14px;box-shadow:0 2px 0 #d8c39f,0 6px 14px rgba(90,58,30,.12)}
.scroll .q{font-style:italic;font-size:16px;line-height:1.45;margin:4px 0}
.scroll .from{font-size:12px;color:#8a6a45}
.scroll .buff{font-size:12px;color:#6b3f12;font-weight:bold;margin-top:4px;font-family:system-ui,sans-serif}
.scroll.locked{background:#ece0c6;color:#8a6a45}
.btn.brown{background:linear-gradient(180deg,#8a5a2b,#5a3a1e);color:#fbf5e6;box-shadow:none;font-family:Georgia,serif}
.libhead{text-align:center;border-bottom:1px solid #c9ae86;margin-bottom:12px;padding-bottom:8px}
.breath{width:min(280px,72vw);height:min(280px,72vw);border-radius:50%;margin:16px auto;display:flex;align-items:center;justify-content:center;position:relative}
.breath .orb{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 45%,#ffe3a0 0%,#ff9f5a 35%,#b44dff 68%,rgba(123,63,228,0) 71%);transform:scale(.55);box-shadow:0 0 60px rgba(255,159,90,.35)}
.breath .ring{position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(245,201,106,.5)}
.breath .txt{position:relative;font-family:var(--serif);font-size:28px;color:#2a1300}
.breath .cnt{position:absolute;bottom:24%;font-size:15px;color:#2a1300;opacity:.85}
.ball{width:min(240px,64vw);height:min(240px,64vw);border-radius:50%;margin:16px auto 6px;position:relative;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.7),rgba(180,120,255,.35) 25%,rgba(40,10,90,.9) 70%);box-shadow:0 0 50px rgba(180,77,255,.6),inset 0 0 40px rgba(255,79,216,.4);overflow:hidden;display:flex;align-items:center;justify-content:center}
.ball .swirl{position:absolute;inset:-20%;background:conic-gradient(from 0deg,transparent,rgba(255,79,216,.35),transparent,rgba(79,243,255,.35),transparent);animation:spin 6s linear infinite;filter:blur(8px)}
@keyframes spin{to{transform:rotate(360deg)}}
.ball svg{position:relative;width:46%;height:46%}
.stand{width:min(160px,44vw);height:28px;margin:-8px auto 10px;background:linear-gradient(#c9942f,#5a3a1e);clip-path:polygon(15% 0,85% 0,100% 100%,0 100%);border-radius:4px}
.ticker{overflow:hidden;white-space:nowrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 0;font-family:ui-monospace,Menlo,monospace;font-size:13px;margin:10px 0}
.ticker span{display:inline-block;padding-left:100%;animation:tick 18s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}
.up{color:#8dffb5}.down{color:#ff7a8a}
.sb{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:700px){.sb{grid-template-columns:1fr 1fr}}
.spell{padding:10px 12px;border-radius:12px;background:rgba(18,6,38,.7);border:1px solid var(--line)}
.spell .n{font-family:var(--serif);color:var(--gold2);font-size:17px}
.spell .r{letter-spacing:2px;font-size:12px;color:var(--cyan);margin:2px 0}
.spell.locked{opacity:.7;border-style:dashed}
.words{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.words .w{padding:6px 9px;border-radius:10px;background:rgba(80,36,140,.6);border:1px solid var(--line);font-size:12px}
.words .w b{font-family:var(--serif);letter-spacing:2px}
#win{justify-content:center;text-align:center}
/* ===== Oasis Survival ===== */
#survival{padding:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#svc{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#svHud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 6px) 8px 0;pointer-events:none;z-index:3}
.svxp{position:relative;height:16px;border-radius:8px;background:rgba(10,3,24,.8);border:1px solid var(--line);overflow:hidden}
.svxp i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#4ff3ff,#7b3fe4,#ff4fd8);transition:width .15s}
.svxp span{position:absolute;inset:0;text-align:center;font-size:11px;line-height:15px;font-weight:700;color:#fff;text-shadow:0 0 4px #000}
.svrow{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:6px}
.svrow .chip{pointer-events:auto;font-size:12px;padding:4px 9px}
.svtime{font-family:var(--serif);font-size:24px;color:var(--gold);text-shadow:0 0 10px rgba(245,201,106,.7)}
#svBoss{display:none;margin:6px auto 0;max-width:420px;text-align:center}
#svBoss.on{display:block}
#svBoss .nm{font-family:var(--serif);font-size:13px;color:#ffd9f6;text-shadow:0 0 8px var(--neon)}
#svSpells{position:absolute;left:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);display:flex;flex-wrap:wrap;gap:4px;max-width:70vw;pointer-events:none;z-index:3}
#svSpells span{font-size:10px;padding:3px 6px;border-radius:8px;background:rgba(10,3,24,.75);border:1px solid var(--line);letter-spacing:1px}
#svSpells span.f{border-color:var(--gold);color:var(--gold2);box-shadow:0 0 8px rgba(245,201,106,.5)}
#svSpells span.p{border-color:rgba(79,243,255,.5);color:#bff9ff}
.svov{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:rgba(5,0,15,.72);padding:14px;overflow-y:auto}
.svov.on{display:flex;animation:fadeIn .2s}
.svov .panel{width:100%;max-width:560px;text-align:center;max-height:94vh;overflow-y:auto}
.svcards{display:grid;grid-template-columns:1fr;gap:8px;margin:10px 0}
@media(min-width:760px){.svcards{grid-template-columns:repeat(3,1fr)}.svov .panel{max-width:860px}}
.svcard{text-align:left;padding:12px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(60,24,110,.95),rgba(20,7,44,.95));display:flex;flex-direction:column;gap:4px;min-height:84px}
.svcard:hover{box-shadow:0 0 18px rgba(255,79,216,.4)}
.svcard .k{font-size:10px;letter-spacing:2px;color:var(--cyan);text-transform:uppercase}
.svcard .t{font-family:var(--serif);font-size:18px;color:var(--gold)}
.svcard .ds{font-size:12.5px;opacity:.9;line-height:1.35}
.svcard .pips{letter-spacing:2px;font-size:11px;color:var(--gold2)}
.svcard.fusion{border-color:var(--gold);background:linear-gradient(160deg,rgba(130,70,20,.95),rgba(60,14,80,.95));box-shadow:0 0 24px rgba(245,201,106,.55)}
.svcard.fusion .k{color:#ffe34f}
.svcard.art .k{color:#ff9fe8}
.svstats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:10px 0}
.svstats div{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px}
.svstats b{display:block;font-size:18px;color:var(--gold2);font-family:var(--serif)}
.classes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
@media(min-width:760px){.classes{grid-template-columns:repeat(4,1fr)}}
.cls{text-align:left;padding:10px;border-radius:14px;border:1px solid var(--line);background:rgba(28,11,56,.85);display:flex;flex-direction:column;gap:3px;min-height:96px}
.cls .t{font-family:var(--serif);color:var(--gold);font-size:16px}
.cls .w{font-size:11px;letter-spacing:2px;color:var(--cyan)}

<script>
'use strict';
/* =========================================================
   PLATFORM ADAPTER: the only place that touches storage,
   ads and leaderboards. Swap this object for a RUN.world SDK
   implementation later (save -> SDK storage, showAd -> SDK ads,
   submitScore -> SDK leaderboard). No network code here.
   ========================================================= */
const SAVE_KEY = 'pharaohSpells.v1';
const Platform = {
  name: 'local',
  save(key, data) { try { localStorage.setItem(key, JSON.stringify(data)); return true; } catch (e) { return false; } },
  load(key) { try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : null; } catch (e) { return null; } },
  clear(key) { try { localStorage.removeItem(key); } catch (e) {} },
  showAd(placement) { return Promise.resolve({ shown: false, placement }); },
  submitScore(board, score) { return Promise.resolve({ ok: true, local: true, board, score }); },
  haptic(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
};

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const SPEED = /[?&]fast/.test(location.search) ? 5 : 1;
const sleep = ms => new Promise(r => setTimeout(r, ms / SPEED));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ================= sound (WebAudio synth) ================= */
const Sound = {
  ctx: null, muted: false,
  init() {
    try {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) {}
  },
  tone(f, d, type = 'sine', v = .12, w = 0, slide = 0) {
    if (this.muted || !this.ctx) return;
    const t = this.ctx.currentTime + w, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + d + .03);
  },
  noise(d, v = .1, w = 0, hp = 800) {
    if (this.muted || !this.ctx) return;
    const t = this.ctx.currentTime + w, n = Math.floor(this.ctx.sampleRate * d), buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = this.ctx.createBufferSource(), g = this.ctx.createGain(), f = this.ctx.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = hp; s.buffer = buf; g.gain.value = v;
    s.connect(f); f.connect(g); g.connect(this.ctx.destination); s.start(t);
  },
  play(n) {
    try {
      const T = (...a) => this.tone(...a);
      switch (n) {
        case 'tap': T(660, .06, 'triangle', .06); break;
        case 'select': T(523, .07, 'triangle', .08); T(784, .09, 'triangle', .06, .05); break;

function finishTraining() {
  const t = T; cancelAnimationFrame(t.raf); T = null;

    [{ label: 'Back to Training', cls: 'ghost', fn: () => show('training') }, { label: 'To the Oasis', fn: () => show('hub') }]);
}

let BR = null;
const PH = [{ n: 'Breathe in', d: 4, s: 'inhale' }, { n: 'Hold', d: 4, s: 'hold' }, { n: 'Breathe out', d: 6, s: 'exhale' }];
function renderHearth() {
  $('#hearthBody').innerHTML = `<h2 style="margin:4px 0">Our Home Base</h2><p class="muted" style="max-width:520px;margin:4px auto">Sit by the hearth with Patrick. Follow the light: in for 4, hold for 4, out for 6. Each full breath restores mana and a little health. Two full breaths leave you <b>Centered</b> (calm +25% next battle).</p>
  <div class="breath"><div class="orb" id="orb"></div><div class="ring"></div><div class="txt" id="btxt">Ready</div><div class="cnt" id="bcnt"></div></div>
  <div class="small" id="bstat">Mana ${Math.floor(S.mana)}/${maxMana()} · HP ${Math.ceil(S.hp)}/${maxHp()}${S.centered ? ' · Centered ✦' : ''}</div>
  <div class="stack" style="margin-top:12px"><button class="btn calm" id="bStart">Begin breathing</button></div>`;
  $('#bStart').onclick = () => { if (BR) stopBreath(true); else startBreath(); };
}
function startBreath() {
  BR = { start: performance.now(), cycles: 0, ph: -1, raf: 0 }; $('#bStart').textContent = 'Stop';
  BR.raf = requestAnimationFrame(breathLoop);
}
function stopBreath(rerender) { if (BR) { cancelAnimationFrame(BR.raf); BR = null; save(); } if (rerender && current === 'hearth') renderHearth(); }
function breathLoop() {
  if (!BR) return;
  const cyc = 14000 / SPEED, el = (performance.now() - BR.start), c = Math.floor(el / cyc), tin = (el % cyc) / (cyc / 14);
  if (c > BR.cycles) {
    BR.cycles = c; S.mana = Math.min(maxMana(), S.mana + maxMana() * .35); S.hp = Math.min(maxHp(), S.hp + maxHp() * .08);
    if (c >= 2 && !S.centered) { S.centered = true; toast('You feel Centered ✦ (calm +25% next battle)'); Sound.play('purify'); }
    else Sound.play('heal');
    save(); updateTop();
  }
  const pi = tin < 4 ? 0 : tin < 8 ? 1 : 2, p = PH[pi];
  if (pi !== BR.ph) { BR.ph = pi; Sound.play(p.s); }
  const local = pi === 0 ? tin : pi === 1 ? tin - 4 : tin - 8;
  const sc = pi === 0 ? .55 + .45 * (local / 4) : pi === 1 ? 1 : 1 - .45 * (local / 6);
  const orb = $('#orb'); if (!orb) return;
  orb.style.transform = `scale(${sc})`;
  $('#btxt').textContent = p.n; $('#bcnt').textContent = Math.ceil(p.d - local);
  $('#bstat').textContent = `Breaths ${BR.cycles} · Mana ${Math.floor(S.mana)}/${maxMana()} · HP ${Math.ceil(S.hp)}/${maxHp()}${S.centered ? ' · Centered ✦' : ''}`;
  BR.raf = requestAnimationFrame(breathLoop);
}

function slotPack(n) { if (n === SLOTS.active) slotSave(true); const m = SLOTS.meta[n]; return { name: m.name, play: m.play || 0, created: m.created, last: m.last, data: Platform.load(slotKey(n)) }; }
function slotExportJson(n) { return JSON.stringify({ format: 'pharaohSpells.slot', v: 2, exported: new Date().toISOString(), slot: n, ...slotPack(n) }); }
function slotExportAllJson() { slotsInit(); const slots = {}; for (let n = 1; n <= SLOT_N; n++) if (SLOTS.meta[n]) slots[n] = slotPack(n); return JSON.stringify({ format: 'pharaohSpells.all', v: 2, exported: new Date().toISOString(), active: SLOTS.active, slots }); }
function slotDownload(text, fname) {
  try { const a = document.createElement('a'), url = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1500); toast('Downloaded ' + fname); } catch (e) { toast('Download not available here; copy the text instead.'); }
}
function slotCopyText(text) {
  const done = () => toast('Copied to clipboard');
  const fallback = () => { const t = $('#slotJson'); if (t) { t.removeAttribute('readonly'); t.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('Select the text and copy it'); } } };
  try { if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback); else fallback(); } catch (e) { fallback(); }
}
function slotShowExport(text, fname, what) {
  modal(`<h2>Export ${slotEsc(what)}</h2><p class="small muted">Keep this text or file somewhere safe. Import it later on any device to restore.</p><textarea id="slotJson" class="slotjson" readonly>${slotEsc(text)}</textarea><div class="small muted">${(text.length / 1024).toFixed(1)} KB</div>`,
    [{ label: 'Close', cls: 'ghost' }, { label: 'Copy text', cls: 'calm', fn: () => slotCopyText(text) }, { label: 'Download file', fn: () => slotDownload(text, fname) }]);
}
const slotFileName = n => n ? `pharaoh-slot${n}-${(SLOTS.meta[n].name || 'save').replace(/[^a-z0-9]+/gi, '-').toLowerCase()}.json` : 'pharaoh-all-saves.json';
function slotParse(text) {
  let o; try { o = JSON.parse(String(text || '').trim()); } catch (e) { return { err: 'That text is not valid save JSON.' }; }
  if (o && o.format === 'pharaohSpells.all' && o.slots && typeof o.slots === 'object') {
    const list = Object.keys(o.slots).map(k => [+k, o.slots[k]]).filter(([k, p]) => k >= 1 && k <= SLOT_N && p && slotValid(p.data));
    return list.length ? { all: list, active: o.active } : { err: 'No valid saves inside that backup.' };
  }
  if (o && o.format === 'pharaohSpells.slot' && slotValid(o.data)) return { one: o };
  if (slotValid(o)) return { one: { name: 'Imported journey', data: o } }; /* a raw v1 save */
  return { err: 'That does not look like a Lord Pharaoh save.' };
}
function slotWrite(n, p) { Platform.save(slotKey(n), p.data); SLOTS.meta[n] = slotMetaNew(p.name || 'Journey ' + n, { play: +p.play || 0 }); }
function slotDoImport(text, target) {
  const r = slotParse(text); if (r.err) { toast(r.err); return false; }
  if (r.one) {
    const n = target || slotFirstEmpty(); if (!n) { toast('No empty slot. Delete one first or use Import here on a slot.'); return false; }
    const go = () => { if (n === SLOTS.active) { slotWrite(n, r.one); slotsSaveIndex(); slotLoadInto(n); } else { slotWrite(n, r.one); slotsSaveIndex(); } renderSlots(); toast(`Imported into Slot ${n}`); Sound.play('coin'); };
    if (SLOTS.meta[n]) modal(`<h2>Overwrite Slot ${n}?</h2><p>“${slotEsc(SLOTS.meta[n].name)}” will be replaced.</p>`, [{ label: 'Cancel', cls: 'ghost' }, { label: 'Overwrite', cls: 'danger', fn: go }]); else go();
    return true;
  }
  const over = r.all.filter(([k]) => SLOTS.meta[k]).map(([k]) => k);
  const go = () => { for (const [k, p] of r.all) slotWrite(k, p); if (r.active && SLOTS.meta[r.active]) SLOTS.active = r.active; slotsSaveIndex(); if (SLOTS.active) slotLoadInto(SLOTS.active); renderSlots(); toast(`Restored ${r.all.length} save${r.all.length > 1 ? 's' : ''}`); Sound.play('coin'); };
  if (over.length) modal(`<h2>Restore backup?</h2><p>This backup has ${r.all.length} save(s) and will replace Slot ${over.join(', ')}.</p>`, [{ label: 'Cancel', cls: 'ghost' }, { label: 'Restore', cls: 'danger', fn: go }]); else go();
  return true;
}
function slotShowImport(target) {
  modal(`<h2>Import ${target ? 'into Slot ' + target : 'save'}</h2><p class="small muted">Paste exported text, or choose a .json backup file. “Export all” backups restore every slot.</p><textarea id="slotJson" class="slotjson" placeholder='{"format":"pharaohSpells.slot", ...}'></textarea><label class="btn ghost slotfile">Choose file…<input type="file" id="slotFile" accept=".json,application/json,text/plain"></label>`,
    [{ label: 'Cancel', cls: 'ghost' }, { label: 'Import', fn: () => slotDoImport($('#slotJson').value, target) }]);
  const f = $('#slotFile'); if (f) f.onchange = () => { const file = f.files && f.files[0]; if (!file) return; const rd = new FileReader(); rd.onload = () => { $('#slotJson').value = rd.result; toast('File loaded. Tap Import.'); }; rd.readAsText(file); };
}

/* ---------- slot summary + screen ---------- */
function slotSummary(n) {
  const d = Platform.load(slotKey(n)); if (!slotValid(d)) return null;
  const keep = S; let r = null;
  try {
    S = Object.assign(newState(), JSON.parse(JSON.stringify(d))); const m = svMeta(), L = m.look;
    const ch = (SV_CHARS.find(c => c.id === L.ch) || { n: 'Lord Pharaoh' }).n, sk = (SV_SKINS.find(c => c.id === L.skin) || { n: '' }).n;
    r = { port: heroPortrait(), ch, sk, pet: L.pet === 'jojo', wave: S.wave, won: S.won, intro: S.introSeen, level: S.level, gold: Math.floor(S.gold), rp: m.rp || 0, best: (m.best && m.best.time) || 0, fus: Object.keys(m.fusions || {}).length, runs: m.runs || 0 };
  } catch (e) { r = { port: '', ch: 'Lord Pharaoh', sk: '', pet: false, wave: d.wave || 0, level: d.level, gold: Math.floor(d.gold), rp: 0, best: 0, fus: 0 }; }
  finally { S = keep; }
  return r;
}
const slotPlayT = s => { s = Math.floor(s || 0); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}h ${m}m` : m ? `${m}m` : (s ? '<1m' : '0m'); };
function slotWhen(t) {
  if (!t) return '—'; const d = new Date(t), now = new Date(), diff = (now - d) / 1000;
  if (diff < 60) return 'just now'; if (diff < 3600) return Math.floor(diff / 60) + ' min ago';
  const same = d.toDateString() === now.toDateString(); const tm = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  return same ? 'today ' + tm : d.toLocaleDateString([], { month: 'short', day: 'numeric', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric' }) + ' ' + tm;
}
function renderSlots() {
  slotsInit(); if (SLOT_UI.back && SLOT_UI.back !== 'title' && SLOTS.active) slotSave(true);
  const fromGame = SLOT_UI.back && SLOT_UI.back !== 'title' && SLOTS.active;
  let cards = '';
  for (let n = 1; n <= SLOT_N; n++) {
    const m = SLOTS.meta[n];
    if (!m) { cards += `<div class="sslot empty" data-n="${n}"><div class="slothead"><div class="slotnum">${n}</div><div class="grow"><div class="sn">Empty slot</div><div class="small muted">Start a fresh journey here</div></div></div><div class="slotbtns"><button class="btn neon" data-a="new">New Game</button><button class="btn ghost" data-a="import">Import here</button></div></div>`; continue; }
    const s = slotSummary(n) || {}; const on = n === SLOTS.active;
    const story = s.won ? 'Wraith calmed ✦' : !s.intro ? 'Prologue' : `Wave ${Math.min(5, (s.wave || 0) + 1)}/5`;
    cards += `<div class="sslot${on ? ' on' : ''}" data-n="${n}">
      <div class="slothead"><div class="portrait">${s.port || ''}</div><div class="grow"><div class="sn">${slotEsc(m.name)}</div><div class="small muted">Slot ${n} · ${slotEsc(s.ch)}${s.sk ? ' · ' + slotEsc(s.sk) : ''}${s.pet ? ' · Jojo' : ''}</div></div>${on ? '<span class="badge">Active</span>' : ''}</div>
      <div class="slotgrid"><div><b>${story}</b>Story</div><div><b>${s.level}</b>Level</div><div><b>${s.gold}</b>Gold</div><div><b>${s.rp}</b>Research</div><div><b>${fmtT(s.best)}</b>Best survival</div><div><b>${s.fus}/${SV_FUSIONS.length}</b>Fusions</div><div><b>${slotPlayT(m.play)}</b>Play time</div><div><b>${slotWhen(m.last)}</b>Last played</div></div>
      <div class="slotbtns"><button class="btn" data-a="play">${on && fromGame ? 'Resume' : on ? 'Continue' : 'Play'}</button><button class="btn ghost" data-a="rename">Rename</button><button class="btn ghost" data-a="copy">Copy</button><button class="btn ghost" data-a="export">Export</button><button class="btn ghost" data-a="import">Import</button><button class="btn ghost danger" data-a="delete">Delete</button></div></div>`;
  }
  const used = Object.keys(SLOTS.meta).length;
  $('#slotsBody').innerHTML = `<div class="slottop"><button class="chip" id="slotBack">‹ ${fromGame ? 'Back to game' : 'Title'}</button><h2 style="margin:0">Save Slots</h2><span class="chip">${used}/${SLOT_N}</span></div>
    <p class="small muted center" style="margin:4px 0 10px">Each slot is a separate journey: story, survival, unlocks and Jojo. Pick any slot to switch.</p>
    <div class="sslots">${cards}</div>
    <div class="stack" style="margin-top:14px"><button class="btn calm" id="slotExpAll"${used ? '' : ' disabled'}>Export all saves (backup)</button><button class="btn ghost" id="slotImpAll">Import save or backup</button></div>
    <p class="small muted center slothint">🔒 Saves live in this browser on this device only. Clearing site data or switching browsers removes them, so use Export to back up or move them.${SLOTS.migrated ? '<br>Your earlier save was moved into Slot 1 (the original is kept as a backup).' : ''}</p>`;
  $('#slotBack').onclick = () => { Sound.play('tap'); show(fromGame ? (SLOT_UI.back === 'slots' ? 'hub' : SLOT_UI.back) : 'title'); };
  $('#slotExpAll').onclick = () => { Sound.play('tap'); slotShowExport(slotExportAllJson(), slotFileName(0), 'all saves'); };
  $('#slotImpAll').onclick = () => { Sound.play('tap'); slotShowImport(0); };
  document.querySelectorAll('#slotsBody .sslot').forEach(c => c.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
    const n = +c.dataset.n, a = b.dataset.a; Sound.play('tap');
    if (a === 'play') { if (n === SLOTS.active && fromGame) { show(SLOT_UI.back); return; } slotPlay(n); }
    else if (a === 'new') slotNewGame(n); else if (a === 'rename') slotRename(n); else if (a === 'copy') slotCopy(n);
    else if (a === 'export') slotShowExport(slotExportJson(n), slotFileName(n), SLOTS.meta[n].name); else if (a === 'import') slotShowImport(n); else if (a === 'delete') slotDelete(n);
  }));
}
function slotRenderTitle() {
  slotsInit(); const b = $('#btnContinue');
  if (SLOTS.active) { b.style.display = ''; b.textContent = 'Continue · ' + SLOTS.meta[SLOTS.active].name; } else b.style.display = 'none';
  const n = Object.keys(SLOTS.meta).length, s = $('#btnSlots'); if (s) s.textContent = `Save Slots (${n}/${SLOT_N})`;
  pwaUpdateBtn();
}
function slotEnsureForSurvival() { /* survival from the title with no active slot gets its own slot */
  slotsInit(); if (SLOTS.active) return true;
  const n = slotFirstEmpty(); if (!n) { toast('All slots are full. Pick one to play.'); show('slots'); return false; }
  slotCreate(n, 'Journey ' + n); return true;
}

/* ---------- install as an app (PWA) ---------- */
let PWA_EVT = null;
const pwaInstalled = () => { try { return matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || navigator.standalone === true; } catch (e) { return false; } };
const pwaIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const pwaHosted = () => /^https?:$/.test(location.protocol) && !!document.querySelector('link[rel="manifest"]');
function pwaUpdateBtn() { const b = $('#btnInstall'); if (b) b.style.display = (!pwaInstalled() && (PWA_EVT || (pwaHosted() && pwaIOS()))) ? '' : 'none'; }
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); PWA_EVT = e; pwaUpdateBtn(); });
window.addEventListener('appinstalled', () => { PWA_EVT = null; pwaUpdateBtn(); toast('Installed! Find Lord Pharaoh on your home screen.'); });
function pwaInstall() {
  if (PWA_EVT) { const e = PWA_EVT; PWA_EVT = null; e.prompt(); (e.userChoice || Promise.resolve({})).then(c => { if (c && c.outcome === 'accepted') toast('Installing…'); pwaUpdateBtn(); }).catch(() => {}); return; }
  if (pwaIOS()) modal('<h2>Add to Home Screen</h2><p>In Safari, tap <b>Share</b> (the square with an ↑ arrow) at the bottom of the screen, then choose <b>Add to Home Screen</b> and tap <b>Add</b>.</p><p class="small muted">Lord Pharaoh then opens full screen and plays offline.</p>', [{ label: 'Got it' }]);
  else modal('<h2>Install the game</h2><p>Open your browser menu (⋮) and choose <b>Install app</b> or <b>Add to Home screen</b>.</p>', [{ label: 'Got it' }]);
}
(function pwaBoot() {
  if (!pwaHosted() || !('serviceWorker' in navigator)) return; /* file:// or single-file use: do nothing */
  window.addEventListener('load', () => { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} });
})();
$('#btnSlots').onclick = () => { Sound.init(); Sound.play('select'); show('slots'); };
$('#btnInstall').onclick = () => { Sound.play('select'); pwaInstall(); };

window.addEventListener('resize', resize);
(function boot() {
  resize(); requestAnimationFrame(frame);
  if (load()) Sound.muted = !!S.muted;
  if (!S.forecast) rollForecast();
  show('title');
})();
window.__game = { get S() { return S; }, get B() { return B; }, get T() { return T; }, COMBOS, WORDS, resolveVerse, show, Platform, startBattle };
</script>
</body>
